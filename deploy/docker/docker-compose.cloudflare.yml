# Cloudflare Tunnel overlay: keep Caddy off host ports and let cloudflared
# reach it over a shared Docker network.
services:
  caddy:
    ports: !reset []
    networks:
      edge: {}
      cloudflare:
        aliases:
          - beancount-caddy

networks:
  cloudflare:
    external: true
    name: ${CLOUDFLARE_NETWORK:-cloudflare}
